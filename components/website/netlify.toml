[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/owner/*"
  [headers.values]
    Cache-Control = "no-store, private"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"

[[redirects]]
  from = "/campaigns/waterdeep/"
  to = "/campaigns/waterdeep-dragonheist-dotmm/"
  status = 301

[[redirects]]
  from = "/campaigns/drakkenheim/"
  to = "/campaigns/witchlight/"
  status = 301

[[redirects]]
